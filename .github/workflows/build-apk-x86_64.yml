name: Build sing-box-easy APK (ImmortalWrt 25.12.1 x86_64)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools for apk-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libssl-dev zlib1g-dev libzstd-dev scdoc lua5.3 liblua5.3-dev

      - name: Build apk-tools (v3 with mkpkg support)
        run: |
          git clone --depth 1 --branch v3.0.0_rc1 https://github.com/alpinelinux/apk-tools.git /tmp/apk-tools
          cd /tmp/apk-tools
          meson setup \
            --prefix=/usr/local \
            -Ddocs=disabled \
            -Dtests=disabled \
            -Dhelp=disabled \
            -Dcrypto_backend=openssl \
            -Dlua_version=5.3 \
            build
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          apk --version
          apk mkpkg --help || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: true

      - name: Embed frontend and build backend (linux/amd64)
        run: |
          rm -rf app/webui/dist
          cp -r dist app/webui/dist
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/sing-box-easy ./main.go

      - name: Assemble ImmortalWrt APK package
        run: |
          WORK=$(mktemp -d)
          ROOTFS="$WORK/rootfs"
          SCRIPTS="$WORK/scripts"
          mkdir -p "$ROOTFS/usr/bin" "$ROOTFS/etc/init.d" "$ROOTFS/etc/sing-box-easy" "$ROOTFS/etc/config" "$SCRIPTS"

          install -m 755 build/sing-box-easy "$ROOTFS/usr/bin/sing-box-easy"
          install -m 755 packaging/openwrt/files/sing-box-easy.init "$ROOTFS/etc/init.d/sing-box-easy"
          install -m 644 app.yml.example "$ROOTFS/etc/sing-box-easy/app.yml.example"
          install -m 644 app.yml.example "$ROOTFS/etc/sing-box-easy/app.yml"
          install -m 644 packaging/openwrt/files/uci-sing-box-easy "$ROOTFS/etc/config/sing-box-easy"

          # LuCI 页面
          mkdir -p "$ROOTFS/usr/share/luci/menu.d" "$ROOTFS/usr/share/rpcd/acl.d" "$ROOTFS/www/luci-static/resources/view/sing-box-easy"
          install -m 644 packaging/openwrt/files/luci/menu.d/luci-app-sing-box-easy.json "$ROOTFS/usr/share/luci/menu.d/"
          install -m 644 packaging/openwrt/files/luci/acl.d/luci-app-sing-box-easy.json "$ROOTFS/usr/share/rpcd/acl.d/"
          install -m 644 packaging/openwrt/files/luci/view/sing-box-easy/panel.js "$ROOTFS/www/luci-static/resources/view/sing-box-easy/"

          # 配置文件保护
          mkdir -p "$ROOTFS/lib/apk/packages"
          cat > "$ROOTFS/lib/apk/packages/sing-box-easy.conffiles" << 'EOF'
          /etc/sing-box-easy/app.yml
          /etc/config/sing-box-easy
          EOF

          # 安装/卸载 maintainer scripts
          cat > "$SCRIPTS/post-install" << 'EOF'
          #!/bin/sh
          [ -f /etc/sing-box-easy/app.yml ] || cp /etc/sing-box-easy/app.yml.example /etc/sing-box-easy/app.yml
          if [ -z "${IPKG_INSTROOT:-}" ]; then
              if [ -x /sbin/uci ] || command -v uci >/dev/null 2>&1; then
                  port=$(sed -n 's/^[[:space:]]*port:[[:space:]]*"\{0,1\}\([0-9]\{1,\}\)"\{0,1\}[[:space:]]*$/\1/p' /etc/sing-box-easy/app.yml 2>/dev/null | head -n 1)
                  if [ -n "$port" ]; then
                      uci -q set sing-box-easy.main=sing-box-easy
                      uci -q set sing-box-easy.main.port="$port"
                      uci -q commit sing-box-easy
                  fi
              fi
              [ -x /etc/init.d/rpcd ] && /etc/init.d/rpcd reload >/dev/null 2>&1
              rm -f /tmp/luci-indexcache* /tmp/luci-modulecache/* 2>/dev/null
              /etc/init.d/sing-box-easy enable
              /etc/init.d/sing-box-easy start
          fi
          exit 0
          EOF

          cat > "$SCRIPTS/pre-deinstall" << 'EOF'
          #!/bin/sh
          if [ -z "${IPKG_INSTROOT:-}" ]; then
              /etc/init.d/sing-box-easy stop || true
              /etc/init.d/sing-box-easy disable || true
          fi
          exit 0
          EOF
          chmod +x "$SCRIPTS/post-install" "$SCRIPTS/pre-deinstall"

          mkdir -p apk-out
          SOURCE_DATE_EPOCH=0 apk mkpkg \
            --info "name:sing-box-easy" \
            --info "version:1.4.0" \
            --info "description:Web panel for managing sing-box configurations and lifecycle" \
            --info "arch:x86_64" \
            --info "license:GPL-3.0" \
            --info "maintainer:ywjdlq" \
            --script "post-install:$SCRIPTS/post-install" \
            --script "post-upgrade:$SCRIPTS/post-install" \
            --script "pre-deinstall:$SCRIPTS/pre-deinstall" \
            --files "$ROOTFS" \
            --output apk-out/sing-box-easy_1.4.0_x86_64.apk

          ls -lh apk-out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-easy-immortalwrt-25.12.1-x86_64-apk
          path: apk-out/*.apk
          if-no-files-found: error
