name: Build sing-box-easy APK (ImmortalWrt 25.12.1 x86_64)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-immortalwrt-25-12-1-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            libz-dev rsync unzip wget zlib1g-dev zstd file

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download and extract ImmortalWrt 25.12.1 x86_64 SDK
        run: |
          mkdir -p /tmp/immortalwrt-sdk
          BASE_URL="https://downloads.immortalwrt.org/releases/25.12.1/targets/x86/64"
          SDK_FILE=$(curl -fsSL "$BASE_URL/" | grep -oE 'immortalwrt-sdk-25\.12\.1-x86-64[^"<>]*\.Linux-x86_64\.tar\.(zst|xz)' | head -n 1)
          echo "Downloading $SDK_FILE"
          curl -fsSL "$BASE_URL/$SDK_FILE" -o /tmp/sdk.tar
          tar -xf /tmp/sdk.tar -C /tmp/immortalwrt-sdk --strip-components=1

      - name: Prepare package source in SDK
        run: |
          SDK_DIR=/tmp/immortalwrt-sdk
          PKG_DIR="$SDK_DIR/package/sing-box-easy"
          mkdir -p "$PKG_DIR/src"
          cp -r packaging/openwrt/* "$PKG_DIR/"
          rsync -a --exclude='.git' --exclude='/tmp' ./ "$PKG_DIR/src/"

      - name: Compile sing-box-easy APK
        run: |
          cd /tmp/immortalwrt-sdk
          make defconfig
          make package/sing-box-easy/compile V=s

      - name: Collect generated .apk files
        run: |
          mkdir -p /tmp/apk-out
          find /tmp/immortalwrt-sdk/bin -name "*sing-box-easy*.apk" -exec cp -v {} /tmp/apk-out/ \;
          ls -lh /tmp/apk-out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-easy-immortalwrt-25.12.1-x86_64-apk
          path: /tmp/apk-out/*.apk
          if-no-files-found: error
