name: Build sing-box-easy APK (ImmortalWrt 25.12.1 x86_64)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: true

      - name: Embed frontend and build backend (linux/amd64)
        run: |
          rm -rf app/webui/dist
          cp -r dist app/webui/dist
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/sing-box-easy ./main.go

      - name: Download ImmortalWrt 25.12.1 SDK for apk tool
        run: |
          mkdir -p /tmp/immortalwrt-sdk
          BASE_URL="https://downloads.immortalwrt.org/releases/25.12.1/targets/x86/64"
          SDK_FILE=$(curl -fsSL "$BASE_URL/" | grep -oE 'immortalwrt-sdk-25\.12\.1-x86-64[^"<>]*\.Linux-x86_64\.tar\.(zst|xz)' | head -n 1)
          echo "Downloading $SDK_FILE"
          curl -fsSL "$BASE_URL/$SDK_FILE" -o /tmp/sdk.tar
          tar -xf /tmp/sdk.tar -C /tmp/immortalwrt-sdk --strip-components=1 staging_dir/host/bin/apk

      - name: Build ImmortalWrt APK
        run: |
          chmod +x packaging/openwrt/build-apk.sh
          mkdir -p apk-out
          packaging/openwrt/build-apk.sh \
            build/sing-box-easy \
            "1.4.0" \
            "x86_64" \
            apk-out \
            /tmp/immortalwrt-sdk/staging_dir/host/bin/apk
          ls -lh apk-out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-easy-immortalwrt-25.12.1-x86_64-apk
          path: apk-out/*.apk
          if-no-files-found: error
